[pytest]
# Run from the backend/ directory: `pytest`
# `.` = backend/ (the app package); `..` = repo root, so the Workstream B `models/` and
# Workstream C `automation/` top-level packages import exactly as in the Docker image
# (backend/Dockerfile sets PYTHONPATH="/app:/app/backend").
pythonpath = . ..
testpaths = tests
addopts = -q
